services:
  app:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8000
      - APP_KEY=${APP_KEY}
      - APP_SECRET=${APP_SECRET}
      - AUTH_CODE=${AUTH_CODE}
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - REFRESH_TOKEN=${REFRESH_TOKEN}
      - SHOP_CIPHER=${SHOP_CIPHER}
      - ACCURATE_APP_KEY=${ACCURATE_APP_KEY}
      - ACCURATE_SIGNATURE_SECRET=${ACCURATE_SIGNATURE_SECRET}
      - ACCURATE_API_TOKEN=${ACCURATE_API_TOKEN}
      - ACCURATE_HOST=${ACCURATE_HOST}
      - ACCURATE_TIKTOK_CUSTOMER_ID=${ACCURATE_TIKTOK_CUSTOMER_ID}
      - ACCURATE_SHOPEE_CUSTOMER_ID=${ACCURATE_SHOPEE_CUSTOMER_ID}
      - ACCURATE_WAREHOUSE_ID=${ACCURATE_WAREHOUSE_ID}
      - TIKTOK_SERVICE_ID=${TIKTOK_SERVICE_ID}
      - SESSION_SECRET=${SESSION_SECRET}
      - SHOPEE_REDIRECT_URL=${SHOPEE_REDIRECT_URL}
      - SHOPEE_PARTNER_ID=${SHOPEE_PARTNER_ID}
      - SHOPEE_PARTNER_KEY=${SHOPEE_PARTNER_KEY}
      - SHOPEE_USE_SANDBOX=${SHOPEE_USE_SANDBOX}
      - SHOPEE_AUTH_CODE=${SHOPEE_AUTH_CODE}
      - SHOPEE_SHOP_ID=${SHOPEE_SHOP_ID}
      - SHOPEE_PUSH_PARTNER_KEY=${SHOPEE_PUSH_PARTNER_KEY}
      - SHOPEE_WEBHOOK_URL=${SHOPEE_WEBHOOK_URL}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - DB_SEED_TOKEN=${DB_SEED_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.goza-sync.loadbalancer.server.port=8000"
      - "traefik.http.routers.goza-sync-secure.rule=Host(`gozaindonesia.tech`) || Host(`www.gozaindonesia.tech`)"
      - "traefik.http.routers.goza-sync-secure.entrypoints=websecure"
      - "traefik.http.routers.goza-sync-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.goza-sync-plain.rule=Host(`gozaindonesia.tech`) || Host(`www.gozaindonesia.tech`)"
      - "traefik.http.routers.goza-sync-plain.entrypoints=web"
      - "traefik.http.routers.goza-sync-plain.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=axelbastiaan@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
